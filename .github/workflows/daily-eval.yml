name: daily-eval
on:
  schedule:
    - cron: "30 2 * * *"      # every day, 08:00 IST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Run the agent on today's sample and score it
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          SAMPLE_PER_SPLIT: ${{ vars.SAMPLE_PER_SPLIT || '25' }}      # 50 messages a day fits the free tier
          LLM_PAUSE_SECONDS: ${{ vars.LLM_PAUSE_SECONDS || '7' }}
          LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || '90' }}
          GEMINI_THINKING_LEVEL: ${{ vars.GEMINI_THINKING_LEVEL || '' }}
          PYTHONUNBUFFERED: "1"                                         # show progress live in the log
        run: python agent/evaluate.py
      - name: Publish results
        run: |
          git config user.name "triage-agent-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/
          git commit -m "Daily eval $(date -u +%F)" || echo "nothing to commit"
          git push
